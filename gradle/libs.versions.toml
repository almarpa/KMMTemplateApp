[versions]
agp = "9.0.0"
kotlin = "2.4.0-Beta1"

android-compileSdk = "36"
android-minSdk = "26"
applicationId = "com.almarpa.pokedex"

compose-multiplatform = "1.10.0-rc01"
compose-ui-backhandler = "1.8.0"

material-icons = "1.7.3"
material3 = "1.9.0-beta03"
androidx-nav3 = "1.0.0-alpha06"
androidx-adaptive = "1.3.0-alpha02"

androidx-activityCompose = "1.11.0"
androidx-appcompat = "1.7.1"
androidx-core-ktx = "1.17.0"
androidx-lifecycle = "2.10.0-alpha05"

kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"

kotlinxSerialization = "1.9.0"

koin = "4.1.1"
koin-annotations = "2.3.0"
kotzilla = "2.3.0"
ktor = "3.3.3"
ksp = "2.3.4"
room = "2.8.0"
sqlite = "2.5.0-alpha13"
datastore = "1.1.7"
gson = "2.13.1"
coil3 = "3.2.0"
napier = "2.6.1"
kmpalette = "3.1.0"
core-splashscreen = "1.0.1"
uriKmp = "0.0.18"
moko-permissions = "0.20.1"

compottie = "2.0.0-rc02"

junit = "4.13.2"
mockk = "1.14.9"
turbine = "1.2.1"
androidx-espresso-core = "3.7.0"
androidx-test-junit = "1.3.0"

[libraries]

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }

# Lifecycle
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-nav3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Compose Multiplatform
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }

compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "androidx-adaptive" }

compose-nav3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-nav3" }
compose-material3-adaptive-nav3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "androidx-adaptive" }

compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-components-ui-tooling-preview = { module = "org.jetbrains.compose.components:components-ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-ui-backhandler" }

# Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotations" }

# Ktor
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-ios", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Gson
com-google-code-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil3" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }

# Room
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Preferences
jetpack-datastore = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

# Lottie anims
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compottie-dot = { module = "io.github.alexzhirkevich:compottie-dot", version.ref = "compottie" }
compottie-network = { module = "io.github.alexzhirkevich:compottie-network", version.ref = "compottie" }
compottie-resources = { module = "io.github.alexzhirkevich:compottie-resources", version.ref = "compottie" }

# Logging
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# KMPalette
kmpalette-core = { module = "com.kmpalette:kmpalette-core", version.ref = "kmpalette" }
kmpalette-network = { module = "com.kmpalette:extensions-network", version.ref = "kmpalette" }

# Kotzilla
kotzilla-sdk-compose = { group = "io.kotzilla", name = "kotzilla-sdk-compose", version.ref = "kotzilla" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }

# Others
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
moko-permissions = { module = "dev.icerock.moko:permissions", version.ref = "moko-permissions" }
moko-permissions-compose = { module = "dev.icerock.moko:permissions-compose", version.ref = "moko-permissions" }
moko-permissions-location = { module = "dev.icerock.moko:permissions-location", version.ref = "moko-permissions" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
uri-kmp = { group = "com.eygraber", name = "uri-kmp", version.ref = "uriKmp" }

[plugins]

androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]

core-common = [
    "kotlinx-coroutines-core",
    "kotlinx-datetime",
    "koin-core",
    "koin-annotations",
    "ktor-client-core",
    "com-google-code-gson",
    "kotlin-stdlib",
    "napier",
]

core-datasource = [
    "kotlinx-coroutines-core",
    "kotlinx-datetime",
    "koin-core",
    "jetpack-datastore",
    "com-google-code-gson",
    "kotlin-stdlib",
    "androidx-room-runtime",
    "androidx-sqlite-bundled",
]

core-api = [
    "ktor-client-core",
    "ktor-client-logging",
    "ktor-client-serialization",
    "ktor-client-content-negotiation",
    "ktor-serialization-kotlinx-json",
]

core-presentation = [
    "kotlinx-coroutines-core",
    "kotlinx-datetime",
    "koin-core",
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-navigation",
    "com-google-code-gson",
    "kotlin-stdlib",
    "coil-compose",
    "coil-compose-core",
    "coil-network-ktor3",
    "ktor-client-core",
    "compottie",
    "compottie-dot",
    "compottie-network",
    "compottie-resources",
    "napier",
    "compose-ui-backhandler",
    "kotlinx-serialization-json",
    "uri-kmp",
    "compose-runtime",
    "compose-material3",
    "compose-components-ui-tooling-preview",
    "compose-ui-tooling-preview",
    "compose-ui",
    "compose-components-resources",
    "compose-material-icons",
    "androidx-lifecycle-runtimeCompose",
    "androidx-lifecycle-viewmodelCompose",
    "androidx-lifecycle-viewmodel-nav3",
    "compose-nav3-ui",
    "compose-material3-adaptive",
    "compose-material3-adaptive-nav3",
    "kmpalette-core",
    "kmpalette-network",
    "moko-permissions",
    "moko-permissions-compose",
    "moko-permissions-location"
]

android-core = [
    "kotlinx-coroutines-android",
    "koin-android",
    "koin-compose-viewmodel",
    "kotlin-stdlib",
    "androidx-core-ktx",
]

android-data-core = [
    "ktor-client-okhttp",
    "com-google-code-gson",
]

ios-data-core = [
    "ktor-client-ios",
]

android-presentation = [
    "androidx-appcompat",
    "androidx-activityCompose",
    "koin-android",
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
    "kotlinx-datetime",
    "com-google-code-gson",
    "kotlin-stdlib",
    "compose-ui-tooling",
]
